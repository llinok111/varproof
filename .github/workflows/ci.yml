name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      # The upstream-defect reproductions are advisory on purpose: they assert the
      # *presence* of css-tree bugs, so they must not break a green build when
      # upstream fixes them. The parser tests already cover our own behaviour.
      - name: Upstream defect canary (advisory)
        continue-on-error: true
        run: npm run repro

  lint-docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The documented CLI forms must work on the declared floor as well, not
        # just on the newest runtime.
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm install --no-audit --no-fund

      # Every documented CLI form must actually work.
      - name: README command smoke test
        run: |
          set -e
          node bin/varproof.mjs test/fixtures/clean.css
          node bin/varproof.mjs test/fixtures/broken.css || test $? -eq 1
          node bin/varproof.mjs "test/fixtures/*.css" --format json > /dev/null || test $? -eq 1
          node bin/varproof.mjs test/fixtures > /dev/null || test $? -eq 1
          echo '.a{width:var(--x)}' | node bin/varproof.mjs - || test $? -eq 1
          node bin/varproof.mjs --list-rules > /dev/null
          node bin/varproof.mjs --check-unused test/fixtures/clean.css > /dev/null
          node bin/varproof.mjs --allow-undefined test/fixtures/broken.css > /dev/null || test $? -eq 1
          node bin/varproof.mjs --ignore '--brand' test/fixtures/clean.css > /dev/null
          node bin/varproof.mjs --ignore=--brand test/fixtures/clean.css > /dev/null
          node bin/varproof.mjs --quiet test/fixtures/clean.css > /dev/null
          node bin/varproof.mjs nope.css 2>/dev/null && exit 1 || test $? -eq 2
          node bin/varproof.mjs --bogus 2>/dev/null && exit 1 || test $? -eq 2
          echo "all documented forms work"

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      # The runtime dependency tree is deliberately tiny (one package); a
      # vulnerability there is a vulnerability in this tool. Mirrors that do not
      # implement the audit endpoint are reported as a skip rather than a failure,
      # so the job stays meaningful instead of being disabled.
      - name: Audit the runtime dependency tree
        run: |
          set +e
          out=$(npm audit --omit=dev --audit-level=moderate 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "audit clean"
            exit 0
          fi
          if echo "$out" | grep -qiE "NOT_IMPLEMENTED|audit endpoint returned an error|ENOTFOUND|ECONNREFUSED"; then
            echo "::warning::audit endpoint unavailable on this registry; skipping (not failing)"
            exit 0
          fi
          echo "::error::npm audit reported findings"
          exit 1

      - name: Verify no unexpected runtime dependencies
        run: |
          set -e
          count=$(node -e "console.log(Object.keys(require('./package.json').dependencies || {}).length)")
          echo "runtime dependencies: $count"
          test "$count" -le 1 || { echo "keep the runtime dependency count at 1 (css-tree)"; exit 1; }
